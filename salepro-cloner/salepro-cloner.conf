# ============================================================
# Nginx config untuk SalePro Multi-Store Cloner
# Domain: cloner.dekatpos.com
# Deploy: /var/www/salepro-cloner/
# ============================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name cloner.dekatpos.com www.cloner.dekatpos.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cloner.dekatpos.com www.cloner.dekatpos.com;

    # --- SSL (bikin duluan: certbot --nginx -d cloner.dekatpos.com) ---
    ssl_certificate     /etc/letsencrypt/live/cloner.dekatpos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloner.dekatpos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- App ---
    root /var/www/salepro-cloner;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Upload max (gambar produk nanti via toko, bukan cloner, tapi amankan)
    client_max_body_size 64M;

    # Log
    access_log /var/log/nginx/cloner_dekatpos_access.log;
    error_log  /var/log/nginx/cloner_dekatpos_error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Jalankan PHP via PHP-FPM 8.3
    location = /index.php {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+|)$;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Blok akses file .php lain selain index.php
    location ~ \.php$ {
        return 404;
    }

    # Blok akses dotfiles (.env, .htaccess, dll)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
